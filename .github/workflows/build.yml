name: Build binaries

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "branch to build (e.g., main)"
        required: true
        default: "main"

jobs:
  build-linux:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        architecture: [x64, arm64]
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.branch }}

      - name: Setup CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: "4.x"

      - run: |
          sudo apt update
          if [ "${{ matrix.architecture }}" == "arm64" ]; then
            sudo apt install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
          else
            sudo apt install -y build-essential
          fi

      - run: |
          cd c_nativesocketpal
          mkdir -p build && cd build
          if [ "${{ matrix.architecture }}" == "arm64" ]; then
            cmake .. \
              -DCMAKE_SYSTEM_NAME=Linux \
              -DCMAKE_SYSTEM_PROCESSOR=aarch64 \
              -DCMAKE_C_COMPILER=aarch64-linux-gnu-gcc \
              -DCMAKE_BUILD_TYPE=Release \
              -DNATIVESOCKETPAL_SHARED=1
          else
            cmake .. \
              -DCMAKE_BUILD_TYPE=Release \
              -DNATIVESOCKETPAL_SHARED=1
          fi
          make
          cp libnativesocketpal.so ../libnativesocketpal.so

      - uses: actions/upload-artifact@v6
        with:
          name: nativesocketpal-linux-${{ matrix.architecture }}
          path: c_nativesocketpal/libnativesocketpal.so

  build-osx:
    runs-on: macos-latest
    strategy:
      matrix:
        arch:
          - x64
          - arm64
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.branch }}

      - name: Setup CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: "4.x"

      - run: |
          cd c_nativesocketpal
          mkdir -p build && cd build
          if [ "${{ matrix.arch }}" = "x64" ]; then
            cmake .. -DCMAKE_OSX_ARCHITECTURES="x86_64" -DCMAKE_BUILD_TYPE=Release -DNATIVESOCKETPAL_SHARED=1
          else
            cmake .. -DCMAKE_OSX_ARCHITECTURES="arm64" -DCMAKE_BUILD_TYPE=Release -DNATIVESOCKETPAL_SHARED=1
          fi
          make
          cp libnativesocketpal.dylib ../libnativesocketpal.dylib

      - uses: actions/upload-artifact@v6
        with:
          name: nativesocketpal-osx-${{ matrix.arch }}
          path: c_nativesocketpal/libnativesocketpal.dylib

  build-win-x64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.branch }}

      - name: Setup CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: "4.x"

      - uses: Source-Authors/msvc-dev-cmd@v2
        with:
          arch: x64

      - run: |
          cd c_nativesocketpal
          mkdir build
          cd build
          cmake .. -DNATIVESOCKETPAL_SHARED=1
          cmake --build . --config Release
          copy Release\nativesocketpal.dll ..\nativesocketpal.dll
        shell: powershell

      - uses: actions/upload-artifact@v6
        with:
          name: nativesocketpal-win-x64
          path: c_nativesocketpal\nativesocketpal.dll

  build-android:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - abi: arm64-v8a
            target_dir: android-arm64
          - abi: x86_64
            target_dir: android-x64

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.branch }}

      - name: Setup CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: "4.x"

      - run: sudo apt update && sudo apt install -y unzip

      - uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r28
          add-to-path: false

      - env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          cd c_nativesocketpal
          mkdir -p build/${{ matrix.abi }}
          cmake -S . -B build/${{ matrix.abi }} \
                -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
                -DANDROID_ABI=${{ matrix.abi }} \
                -DANDROID_NATIVE_API_LEVEL=21 \
                -DCMAKE_BUILD_TYPE=Release \
                -DNATIVESOCKETPAL_SHARED=1
          cmake --build build/${{ matrix.abi }}
          mkdir -p ${{ matrix.target_dir }}
          cp build/${{ matrix.abi }}/libnativesocketpal.so ${{ matrix.target_dir }}/

      - uses: actions/upload-artifact@v6
        with:
          name: nativesocketpal-${{ matrix.target_dir }}
          path: c_nativesocketpal/${{ matrix.target_dir }}/

  build-ios-arm64:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.branch }}

      - name: Setup CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: "4.x"

      - run: |
          cd c_nativesocketpal
          mkdir -p build && cd build
          cmake .. \
            -G Xcode \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT=iphoneos \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0 \
            -DNATIVESOCKETPAL_STATIC=1 \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5
          cmake --build . --config Release --target nativesocketpal_static
          cp Release-iphoneos/libnativesocketpal.a ../libnativesocketpal.a

      - uses: actions/upload-artifact@v6
        with:
          name: nativesocketpal-ios-arm64
          path: c_nativesocketpal/libnativesocketpal.a

  build-maccatalyst-arm64:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.branch }}

      - name: Setup CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: "4.x"

      - run: |
          cd c_nativesocketpal
          mkdir -p build && cd build
          cmake .. \
            -G Xcode \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT=macosx \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=13.0 \
            -DNATIVESOCKETPAL_STATIC=1 \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5
          cmake --build . --config Release --target nativesocketpal_static
          cp Release/libnativesocketpal.a ../libnativesocketpal.a

      - uses: actions/upload-artifact@v6
        with:
          name: nativesocketpal-maccatalyst-arm64
          path: c_nativesocketpal/libnativesocketpal.a

  build-tvos-arm64:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.branch }}

      - name: Setup CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: "4.x"

      - run: |
          cd c_nativesocketpal
          mkdir -p build && cd build
          cmake .. \
            -G Xcode \
            -DCMAKE_SYSTEM_NAME=tvOS \
            -DCMAKE_OSX_SYSROOT=appletvos \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0 \
            -DNATIVESOCKETPAL_STATIC=1 \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5
          cmake --build . --config Release --target nativesocketpal_static
          cp Release-appletvos/libnativesocketpal.a ../libnativesocketpal.a

      - uses: actions/upload-artifact@v6
        with:
          name: nativesocketpal-tvos-arm64
          path: c_nativesocketpal/libnativesocketpal.a

  build-watchos-arm64:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.branch }}

      - name: Setup CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: "4.x"

      - run: |
          cd c_nativesocketpal
          mkdir -p build && cd build
          cmake .. \
            -G Xcode \
            -DCMAKE_SYSTEM_NAME=watchOS \
            -DCMAKE_OSX_SYSROOT=watchos \
            -DCMAKE_OSX_ARCHITECTURES=arm64_32 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=7.0 \
            -DNATIVESOCKETPAL_STATIC=1 \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5
          cmake --build . --config Release --target nativesocketpal_static
          cp Release-watchos/libnativesocketpal.a ../libnativesocketpal.a

      - uses: actions/upload-artifact@v6
        with:
          name: nativesocketpal-watchos-arm64
          path: c_nativesocketpal/libnativesocketpal.a

  build-visionos-arm64:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.branch }}

      - name: Setup CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: "4.x"

      - run: |
          cd c_nativesocketpal
          mkdir -p build && cd build
          cmake .. \
            -G Xcode \
            -DCMAKE_SYSTEM_NAME=visionOS \
            -DCMAKE_OSX_SYSROOT=xros \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=1.0 \
            -DNATIVESOCKETPAL_STATIC=1 \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5
          cmake --build . --config Release --target nativesocketpal_static
          cp Release-xros/libnativesocketpal.a ../libnativesocketpal.a

      - uses: actions/upload-artifact@v6
        with:
          name: nativesocketpal-visionos-arm64
          path: c_nativesocketpal/libnativesocketpal.a

  package:
    needs:
      [
        build-linux,
        build-osx,
        build-win-x64,
        build-android,
        build-ios-arm64,
        build-maccatalyst-arm64,
        build-tvos-arm64,
        build-watchos-arm64,
        build-visionos-arm64,
      ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: artifacts

      - run: |
          mkdir -p dist/{linux-x64/native,linux-arm64/native,osx-x64/native,osx-arm64/native,win-x64/native,android-arm64/native,android-x64/native,ios-arm64/native,maccatalyst-arm64/native,tvos-arm64/native,watchos-arm64/native,visionos-arm64/native}

          cp artifacts/nativesocketpal-linux-x64/libnativesocketpal.so dist/linux-x64/native/
          cp artifacts/nativesocketpal-linux-arm64/libnativesocketpal.so dist/linux-arm64/native/

          cp artifacts/nativesocketpal-osx-x64/libnativesocketpal.dylib dist/osx-x64/native/
          cp artifacts/nativesocketpal-osx-arm64/libnativesocketpal.dylib dist/osx-arm64/native/

          cp artifacts/nativesocketpal-win-x64/nativesocketpal.dll dist/win-x64/native/

          cp artifacts/nativesocketpal-android-arm64/libnativesocketpal.so dist/android-arm64/native/
          cp artifacts/nativesocketpal-android-x64/libnativesocketpal.so dist/android-x64/native/

          cp artifacts/nativesocketpal-ios-arm64/libnativesocketpal.a dist/ios-arm64/native/
          cp artifacts/nativesocketpal-maccatalyst-arm64/libnativesocketpal.a dist/maccatalyst-arm64/native/
          cp artifacts/nativesocketpal-tvos-arm64/libnativesocketpal.a dist/tvos-arm64/native/
          cp artifacts/nativesocketpal-watchos-arm64/libnativesocketpal.a dist/watchos-arm64/native/
          cp artifacts/nativesocketpal-visionos-arm64/libnativesocketpal.a dist/visionos-arm64/native/

      - uses: actions/upload-artifact@v6
        with:
          name: nativesocketpal-runtimes
          path: dist